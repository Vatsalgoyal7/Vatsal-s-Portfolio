<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" style="background:#030008; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <radialGradient id="glow-purple" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="65%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
    <mask id="grid-fade">
      <radialGradient id="mask-radial" cx="70%" cy="50%" r="60%">
        <stop offset="20%" stop-color="#ffffff" stop-opacity="1" />
        <stop offset="85%" stop-color="#ffffff" stop-opacity="0" />
      </radialGradient>
      <rect width="1584" height="396" fill="url(#mask-radial)" />
    </mask>
  </defs>

  <!-- Background Base -->
  <rect width="1584" height="396" fill="#030008"/>

  <!-- Ambient Glows -->
  <circle cx="1200" cy="80" r="320" fill="url(#glow-purple)"/>
  <circle cx="950" cy="340" r="280" fill="url(#glow-cyan)"/>

  <!-- Grid Layer -->
  <rect width="1584" height="396" fill="url(#grid)" mask="url(#grid-fade)"/>

  <!-- Subtle accent line on right edge -->
  <path d="M 1250,120 Q 1400,200 1520,160" fill="none" stroke="rgba(124, 58, 237, 0.2)" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="1400" cy="200" r="3" fill="#818cf8" opacity="0.6"/>

  <!-- Content Group (Starts at x=360 to leave clear space for avatar on left) -->
  <g transform="translate(360, 0)">

    <!-- Top Status Badge -->
    <g transform="translate(0, 52)">
      <!-- Pill background -->
      <rect x="0" y="0" width="272" height="32" rx="16" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.28)" stroke-width="1"/>
      <!-- Glowing green dot -->
      <circle cx="18" cy="16" r="4" fill="#10b981"/>
      <circle cx="18" cy="16" r="8" fill="#10b981" opacity="0.25"/>
      <text x="32" y="21" font-size="13" font-weight="600" fill="#6ee7b7" letter-spacing="0.3">Available for Freelance &amp; Projects</text>
    </g>

    <!-- Main Title & Role -->
    <g transform="translate(0, 142)">
      <text x="0" y="0" font-size="54" font-weight="800" fill="url(#text-grad)" letter-spacing="-1.5">Vatsal Goyal</text>
      <text x="345" y="-4" font-size="22" font-weight="600" fill="#94a3b8" letter-spacing="-0.3">/ Web &amp; App Developer</text>
    </g>

    <!-- Tagline -->
    <g transform="translate(0, 182)">
      <text x="0" y="0" font-size="18" font-weight="400" fill="#64748b">
        Crafting clean web &amp; mobile interfaces. <tspan fill="#cbd5e1" font-weight="500">Learning, building, and solving problems.</tspan>
      </text>
    </g>

    <!-- Divider Line -->
    <line x1="0" y1="280" x2="1140" y2="280" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>

    <!-- Bottom Tags & Portfolio URL -->
    <g transform="translate(0, 310)">
      
      <!-- Skill Pills -->
      <g transform="translate(0, 0)">
        <!-- Full-Stack Web -->
        <rect x="0" y="0" width="130" height="34" rx="8" fill="rgba(124, 58, 237, 0.1)" stroke="rgba(124, 58, 237, 0.3)" stroke-width="1"/>
        <text x="65" y="22" font-size="13.5" font-weight="600" fill="#c4b5fd" text-anchor="middle">Full-Stack Web</text>

        <!-- Mobile Apps -->
        <g transform="translate(142, 0)">
          <rect x="0" y="0" width="115" height="34" rx="8" fill="rgba(124, 58, 237, 0.1)" stroke="rgba(124, 58, 237, 0.3)" stroke-width="1"/>
          <text x="57" y="22" font-size="13.5" font-weight="600" fill="#c4b5fd" text-anchor="middle">Mobile Apps</text>
        </g>

        <!-- React & Next.js -->
        <g transform="translate(269, 0)">
          <rect x="0" y="0" width="135" height="34" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
          <text x="67" y="22" font-size="13.5" font-weight="500" fill="#94a3b8" text-anchor="middle">React &amp; Next.js</text>
        </g>

        <!-- Tailwind CSS -->
        <g transform="translate(416, 0)">
          <rect x="0" y="0" width="120" height="34" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
          <text x="60" y="22" font-size="13.5" font-weight="500" fill="#94a3b8" text-anchor="middle">Tailwind CSS</text>
        </g>

        <!-- Node.js -->
        <g transform="translate(548, 0)">
          <rect x="0" y="0" width="85" height="34" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
          <text x="42" y="22" font-size="13.5" font-weight="500" fill="#94a3b8" text-anchor="middle">Node.js</text>
        </g>
      </g>

      <!-- Portfolio Link Chip (Right Aligned) -->
      <g transform="translate(860, 0)">
        <rect x="0" y="0" width="280" height="34" rx="17" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.28)" stroke-width="1"/>
        <text x="24" y="22" font-size="14" fill="#38bdf8">🌐</text>
        <text x="48" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#38bdf8">vatsalgoyalportfolio.vercel.app</text>
      </g>

    </g>

  </g>
</svg>